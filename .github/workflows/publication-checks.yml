name: Publication checks

on:
  push:
    branches: [publication/final-freeze-2026-09-10]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Capture tracked source only for publication audit
        run: |
          mkdir -p /tmp/publication-audit
          git archive --format=zip HEAD -o /tmp/publication-audit/tracked-source.zip
          git ls-files > /tmp/publication-audit/tracked-paths.txt
          git rev-parse HEAD > /tmp/publication-audit/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-audit-source
          path: /tmp/publication-audit/
          retention-days: 7
          if-no-files-found: error
