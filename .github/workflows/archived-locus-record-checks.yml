name: Archived locus record checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Verify record arithmetic and finite coverage
        run: |
          python research/archived_adaptation_locus_2026_09_09/experiments/verify_records.py
          python -m unittest discover -s research/archived_adaptation_locus_2026_09_09/experiments -p 'test_public_records.py' -v
