name: R2 record checks

on:
  pull_request:
  push:
    branches:
      - main
      - experiment/r2-measurement-midpoint-2026-09-08

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recompute compact halfweight result
        run: python experiments/verify_halfweight_public_2026_09_08.py
      - name: Exercise malformed and negative record guards
        run: python -m unittest discover -s experiments -p 'test_halfweight_public_2026_09_08.py' -v
