name: R2 record checks

on:
  pull_request:
  push:
    branches:
      - main
      - experiment/r2-measurement-midpoint-2026-09-08

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Recompute compact halfweight result
        run: python experiments/verify_halfweight_public_2026_09_08.py
      - name: Recompute dense-measurement sensitivity
        run: python experiments/verify_halfweight_dense_2026_09_08.py
      - name: Exercise malformed and negative record guards
        run: python -m unittest discover -s experiments -p 'test_halfweight*.py' -v
