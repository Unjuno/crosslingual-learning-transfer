name: Publish research snapshot

on:
  push:
    branches: [main]
    paths: [publication/release.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Unjuno/crosslingual-learning-transfer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Full verification and compact package before any publication
        run: python scripts/build_release.py
      - name: Publish versioned research tag and verified assets (no overwrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_release.py
