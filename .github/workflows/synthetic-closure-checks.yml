name: Synthetic closure checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Compile final experiment scripts
        run: |
          python -m py_compile \
            experiments/random_rank_state_alignment_gru.py \
            experiments/run_random_rank_hidden_width.py \
            experiments/analyze_random_rank_hidden_width.py \
            experiments/prestate_random_rank_features.py \
            experiments/analyze_prestate_state_rank_predictor.py \
            experiments/random_rank_state_alignment_transformer.py \
            experiments/analyze_random_rank_transformer.py \
            experiments/verify_final_synthetic_closure.py
      - name: Recompute final closure adjudications from committed data
        run: python experiments/verify_final_synthetic_closure.py
