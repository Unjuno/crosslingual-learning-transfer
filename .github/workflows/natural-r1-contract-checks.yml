name: Natural R1 contract checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-r1-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile natural-phase scripts
        run: |
          python -m py_compile \
            experiments/prepare_natural_r1_system_translations.py \
            experiments/natural_ja_en_s2_hidden_teacher.py \
            experiments/run_natural_ja_en_s2_confirmatory.py \
            experiments/adjudicate_natural_ja_en_s2_hidden_teacher.py \
            experiments/verify_natural_r1_confirmatory.py \
            experiments/natural_ja_en_s2_halfweight_tradeoff.py \
            experiments/adjudicate_natural_ja_en_s2_halfweight_tradeoff.py
      - name: Validate locked R1 and R2b designs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r1 = json.loads(Path('protocols/natural_ja_en_s2_hidden_teacher_r1_2026-09-06.json').read_text())
          r2b = json.loads(Path('protocols/natural_ja_en_s2_halfweight_tradeoff_2026-09-06.json').read_text())
          manifest = json.loads(Path('protocols/natural_ja_en_s2_corpus_manifest_2026-09-06.json').read_text())
          assert r1['status'] == 'DESIGN_LOCKED_BEFORE_NEW_OUTCOMES'
          assert r1['confirmatory_plan']['fresh_seeds'] == list(range(31000, 31010))
          assert r2b['status'] == 'LOCKED_BEFORE_FRESH_OUTCOMES'
          assert r2b['fresh_seeds'] == list(range(32000, 32010))
          assert r2b['hidden_distillation_weight'] == 0.5
          assert 'No rescue seeds' in r2b['stopping']
          assert manifest['status'] == 'HASHES_RECORDED_BEFORE_NATURAL_MODEL_OUTCOMES'
          print('R1/R2b protocol contract OK')
          PY
      - name: Incomplete R1 cohort must adjudicate UNCERTAIN
        run: |
          mkdir -p /tmp/empty-r1
          python experiments/adjudicate_natural_ja_en_s2_hidden_teacher.py /tmp/empty-r1 --json-out /tmp/empty-r1/result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/empty-r1/result.json').read_text())
          assert result['verdict']=='UNCERTAIN'
          assert result['missing_seeds']==list(range(31000,31010))
          print('incomplete R1 guard OK')
          PY
      - name: Incomplete R2b cohort must adjudicate UNCERTAIN
        run: |
          mkdir -p /tmp/empty-r2b
          python experiments/adjudicate_natural_ja_en_s2_halfweight_tradeoff.py /tmp/empty-r2b --json-out /tmp/empty-r2b/result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/empty-r2b/result.json').read_text())
          assert result['verdict']=='UNCERTAIN'
          assert result['missing_seeds']==list(range(32000,32010))
          print('incomplete R2b guard OK')
          PY
      - name: Recompute committed R1 confirmatory adjudication
        run: python experiments/verify_natural_r1_confirmatory.py
