name: Finalize reviewed publication inventory
on:
  push:
    branches: [publication/final-freeze-2026-09-10]
permissions:
  contents: read
jobs:
  finalize:
    if: github.repository == 'Unjuno/crosslingual-learning-transfer' && github.ref == 'refs/heads/publication/final-freeze-2026-09-10'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Preserve scientific baseline, pin old checks, and generate inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib
          base='63a6a056f9575d027dde09d3d19be172e821cd95'
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only',base],text=True).splitlines()
          files={}
          for name in sorted(paths):
              p=Path(name)
              science=(name.startswith('protocols/') or name.startswith('results/') or name.startswith('experiments/') or name.startswith('research/')) and p.suffix in {'.py','.csv','.json'}
              if science:files[name]=hashlib.sha256(subprocess.check_output(['git','show',base+':'+name])).hexdigest()
          obj={'source_commit':base,'scope':'Existing scientific protocol/result/source files; publication adds no new learning outcomes. Hashes copied from the tracked baseline.','files':files}
          dest=Path('publication/scientific-snapshot.json');dest.write_text(json.dumps(obj,indent=2)+'\n',encoding='utf-8')
          assert hashlib.sha256(dest.read_bytes()).hexdigest()=='df43c7b4b3283118760f8c8a8d67ce496fe58a499ff0feeb90e1a8c9535db9cc'
          Path('.github/workflows/finalize-publication.yml').unlink()
          for p in Path('.github/workflows').glob('*.yml'):
              if p.name in {'publication-checks.yml','publish-research-snapshot.yml'}:continue
              t=p.read_text(encoding='utf-8').replace('uses: actions/checkout@v4','uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2\n        with:\n          persist-credentials: false').replace('uses: actions/setup-python@v5','uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0')
              if 'permissions:' not in t:t=t.replace('\njobs:', '\npermissions:\n  contents: read\n\njobs:')
              t=t.replace('runs-on: ubuntu-latest','runs-on: ubuntu-latest\n    timeout-minutes: 5')
              p.write_text(t,encoding='utf-8')
          PY
          git add -A
          python scripts/refresh_inventory.py
          git add publication/files.sha256.json
          python scripts/verify_publication.py
      - name: Export verified source and changed files for connector review
        run: |
          python - <<'PY'
          import json,subprocess,zipfile
          from pathlib import Path
          out=Path('/tmp/publication-ready');out.mkdir()
          names=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          with zipfile.ZipFile(out/'verified-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:z.write(name,name)
          entries=[]
          for name in subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines():
              p=Path(name)
              entries.append({'path':name,'mode':'100644','type':'blob',**({'content':p.read_text(encoding='utf-8')} if p.exists() else {'sha':None})})
          (out/'tree-changes.json').write_text(json.dumps(entries,indent=2)+'\n')
          (out/'verification.json').write_bytes(Path('dist/publication-verification.json').read_bytes())
          print('Ready files:',len(names),'Changed entries:',len(entries))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-publication-source
          path: /tmp/publication-ready/
          retention-days: 7
          if-no-files-found: error
